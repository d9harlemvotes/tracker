<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D9 Harlem Votes™ — Voter Registration Tracker</title>
<style>
  :root {
    --red: #CB0606;
    --red-deep: #9B0303;
    --green: #2F5F48;
    --green-deep: #1F4030;
    --black: #1A1A1A;
    --ink: #2E2E2E;
    --muted: #6B6B6B;
    --rule: #DDDDDD;
    --grey-bg: #F4F4F4;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Tri-stripe accent */
  .stripe { display: flex; height: 5px; }
  .stripe .s-red   { flex: 1; background: var(--red); }
  .stripe .s-black { flex: 1; background: var(--black); }
  .stripe .s-green { flex: 1; background: var(--green); }
  .stripe.thin { height: 3px; }

  header {
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0;
  }
  header .inner {
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 20px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  header img.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    flex-shrink: 0;
  }
  header .titlewrap { line-height: 1.15; flex: 1; min-width: 0; }
  header .wordmark {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.2px;
    margin-bottom: 6px;
  }
  header .wm-d9     { color: var(--black); }
  header .wm-harlem { color: var(--black); }
  header .wm-votes  { color: var(--black); }
  header .wm-votes::after {
    content: '™';
    font-size: 14px;
    vertical-align: super;
    margin-left: 1px;
    color: var(--black);
  }
  header .sub {
    font-size: 17px;
    color: var(--ink);
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  body { background: var(--paper); }
  .card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  label {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin: 22px 0 8px;
  }
  label:first-of-type { margin-top: 0; }
  .req { color: var(--red); margin-left: 2px; }
  .optional { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 4px; }

  select, input[type="text"], textarea {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47,95,72,0.15);
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  .radios {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .radio {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .radio:has(input:checked) {
    border-color: var(--green);
    background: #F5F9F6;
  }
  .radio input { margin-top: 4px; flex-shrink: 0; accent-color: var(--green); width: 18px; height: 18px; }
  .radio-label { font-size: 16px; line-height: 1.4; }
  .radio-label strong { display: block; font-weight: 700; color: var(--ink); }
  .radio-label .desc { color: var(--muted); font-size: 14px; margin-top: 3px; }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--red);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  button:active { background: var(--red-deep); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
    display: none;
  }
  .status.ok {
    background: #E8EFEA;
    border-left: 4px solid var(--green);
    color: var(--green-deep);
    display: block;
  }
  .status.err {
    background: #FDEBEB;
    border-left: 4px solid var(--red);
    color: var(--red-deep);
    display: block;
  }
  .count {
    margin-top: 28px;
    padding: 22px 18px;
    background: var(--grey-bg);
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .count strong {
    display: block;
    font-size: 44px;
    color: var(--green);
    margin-top: 4px;
    font-weight: 800;
    line-height: 1;
  }
  optgroup { font-style: normal; font-weight: 700; color: var(--black); }
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .footer .tm-red { color: var(--black); font-weight: 700; }
  .footer .tm-black { color: var(--black); font-weight: 700; }
  .footer .tm-green { color: var(--black); font-weight: 700; }

  /* Smaller screens */
  @media (max-width: 380px) {
    header .inner { padding: 22px 16px 16px; gap: 14px; }
    header img.logo { width: 76px; height: 76px; }
    header .wordmark { font-size: 24px; }
    header .sub { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stripe">
  <div class="s-red"></div>
  <div class="s-black"></div>
  <div class="s-green"></div>
</div>

<header>
  <div class="inner">
    <img class="logo" src="logo.png" alt="D9 Harlem Votes™ logo">
    <div class="titlewrap">
      <div class="wordmark">
        <span class="wm-d9">D9</span>
        <span class="wm-harlem">Harlem</span>
        <span class="wm-votes">Votes</span>
      </div>
      <div class="sub">Voter Registration Tracker</div>
    </div>
  </div>
</header>

<div class="stripe thin">
  <div class="s-red"></div>
  <div class="s-black"></div>
  <div class="s-green"></div>
</div>

<div class="wrap">
  <div class="card">

    <label for="site">Site <span class="req">*</span></label>
    <select id="site" required>
      <option value="">— Select your site —</option>
      <optgroup label="June 6 &amp; June 13">
        <option>E. 116th St. &amp; Lexington Ave.</option>
        <option>W. 116th St. &amp; Frederick Douglass Blvd.</option>
        <option>W. 116th St. &amp; Malcolm X Blvd.</option>
        <option>W. 125th St. &amp; Adam Clayton Powell Jr. Blvd.</option>
        <option>W. 125th St. &amp; Malcolm X Blvd.</option>
        <option>W. 135th St. &amp; Malcolm X Blvd.</option>
        <option>W. 145th St. &amp; Saint Nicholas Ave.</option>
      </optgroup>
      <optgroup label="June 19 — Juneteenth">
        <option>W. 120th St. &amp; Malcolm X Blvd.</option>
      </optgroup>
    </select>

    <label for="volunteer">Your Name <span class="req">*</span></label>
    <input type="text" id="volunteer" placeholder="First and last name" autocomplete="name" required>

    <label>Path <span class="req">*</span></label>
    <div class="radios">
      <label class="radio">
        <input type="radio" name="path" value="A — D9 Harlem Votes™ Drop-Off">
        <span class="radio-label">
          <strong>Path A — D9 Harlem Votes™ Drop-Off</strong>
          <span class="desc">Volunteer collects the form; coalition delivers to NYC Board of Elections.</span>
        </span>
      </label>
      <label class="radio">
        <input type="radio" name="path" value="B — Self-Delivery to NYC Board of Elections">
        <span class="radio-label">
          <strong>Path B — Self-Delivery to NYC Board of Elections</strong>
          <span class="desc">Voter mails or delivers their own form.</span>
        </span>
      </label>
    </div>

    <label for="notes">Notes <span class="optional">(optional)</span></label>
    <textarea id="notes" placeholder="Anything the Activation Lead should know"></textarea>

    <button id="submitBtn">Log Registration</button>
    <div id="status" class="status"></div>

    <div class="count">
      Your registrations this shift
      <strong id="counter">0</strong>
    </div>

  </div>
  <div class="footer">
    <span class="tm-red">D9</span> <span class="tm-black">Harlem</span> <span class="tm-green">Votes™</span> · Boots on the Ground
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKzCDI12QJrdt4xRKmKC3vHxYYmXOBM5hqAO-Q6Q_uJNDUDC5nvN8B5b4gJ8xU7EOjjA/exec';

  let count = 0;
  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  btn.addEventListener('click', submit);

  function submit() {
    const site = document.getElementById('site').value;
    const volunteer = document.getElementById('volunteer').value.trim();
    const pathEl = document.querySelector('input[name="path"]:checked');
    const notes = document.getElementById('notes').value.trim();

    if (!site) return showErr('Please select your site.');
    if (!volunteer) return showErr('Please enter your name.');
    if (!pathEl) return showErr('Please select Path A or Path B.');

    btn.disabled = true;
    btn.textContent = 'Logging…';
    statusEl.style.display = 'none';

    const payload = {
      siteName: site,
      volunteerName: volunteer,
      path: pathEl.value,
      notes: notes
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      count++;
      document.getElementById('counter').textContent = count;
      showOk('Registration logged. ✓');
      document.getElementById('notes').value = '';
      btn.disabled = false;
      btn.textContent = 'Log Registration';
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Log Registration';
      showErr('Connection issue. Check signal and try again.');
    });
  }

  function showOk(msg) {
    statusEl.className = 'status ok';
    statusEl.textContent = msg;
  }
  function showErr(msg) {
    statusEl.className = 'status err';
    statusEl.textContent = msg;
  }
</script>

</body>
</html>
