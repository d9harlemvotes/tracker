<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D9 Harlem Votes™ — Voter Registration Tracker</title>
<style>
  :root {
    --red: #CB0606;
    --red-deep: #9B0303;
    --green: #2F5F48;
    --green-deep: #1F4030;
    --black: #1A1A1A;
    --ink: #2E2E2E;
    --muted: #6B6B6B;
    --rule: #DDDDDD;
    --grey-bg: #F4F4F4;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--grey-bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* Tri-stripe top */
  .stripe-top {
    display: flex;
    height: 6px;
  }
  .stripe-top .s-red   { flex: 1; background: var(--red); }
  .stripe-top .s-black { flex: 1; background: var(--black); }
  .stripe-top .s-green { flex: 1; background: var(--green); }

  header {
    background: var(--black);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header img.logo {
    width: 52px;
    height: 52px;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
    flex-shrink: 0;
  }
  header .titlewrap { line-height: 1.2; }
  header .wordmark {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  header .wordmark .wm-d9    { color: var(--red); }
  header .wordmark .wm-harlem{ color: #fff; }
  header .wordmark .wm-votes { color: #7FBE9F; } /* lighter green for contrast on black */
  header .sub {
    margin-top: 3px;
    font-size: 13px;
    color: #ccc;
  }

  /* Tri-stripe under header */
  .stripe-bottom {
    display: flex;
    height: 4px;
  }
  .stripe-bottom .s-red   { flex: 1; background: var(--red); }
  .stripe-bottom .s-black { flex: 1; background: var(--black); }
  .stripe-bottom .s-green { flex: 1; background: var(--green); }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 20px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin: 18px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  .req { color: var(--red); }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47,95,72,0.15);
  }
  textarea {
    resize: vertical;
    min-height: 70px;
  }
  .radios {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .radio {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .radio input { margin-top: 3px; flex-shrink: 0; accent-color: var(--green); }
  .radio-label { font-size: 15px; line-height: 1.35; }
  .radio-label strong { display: block; font-weight: 600; }
  .radio-label .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  button:active { background: var(--green-deep); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  .status.ok {
    background: #E8EFEA;
    border-left: 4px solid var(--green);
    color: var(--green-deep);
    display: block;
  }
  .status.err {
    background: #FDEBEB;
    border-left: 4px solid var(--red);
    color: var(--red-deep);
    display: block;
  }
  .count {
    margin-top: 20px;
    padding: 14px;
    background: var(--grey-bg);
    border-radius: 6px;
    text-align: center;
    font-size: 14px;
    color: var(--ink);
  }
  .count strong {
    display: block;
    font-size: 32px;
    color: var(--green);
    margin-top: 4px;
    font-weight: 700;
  }
  optgroup { font-style: normal; font-weight: 700; color: var(--black); }
  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="stripe-top">
  <div class="s-red"></div>
  <div class="s-black"></div>
  <div class="s-green"></div>
</div>

<header>
  <img class="logo" src="logo.png" alt="D9 Harlem Votes logo">
  <div class="titlewrap">
    <div class="wordmark">
      <span class="wm-d9">D9</span>
      <span class="wm-harlem">Harlem</span>
      <span class="wm-votes">Votes™</span>
    </div>
    <div class="sub">Voter Registration Tracker</div>
  </div>
</header>

<div class="stripe-bottom">
  <div class="s-red"></div>
  <div class="s-black"></div>
  <div class="s-green"></div>
</div>

<div class="wrap">
  <div class="card">

    <label for="site">Site <span class="req">*</span></label>
    <select id="site" required>
      <option value="">— Select your site —</option>
      <optgroup label="June 6 &amp; June 13">
        <option>E. 116th St. &amp; Lexington Ave.</option>
        <option>W. 116th St. &amp; Frederick Douglass Blvd.</option>
        <option>W. 116th St. &amp; Malcolm X Blvd.</option>
        <option>W. 125th St. &amp; Adam Clayton Powell Jr. Blvd.</option>
        <option>W. 125th St. &amp; Malcolm X Blvd.</option>
        <option>W. 135th St. &amp; Malcolm X Blvd.</option>
        <option>W. 145th St. &amp; Saint Nicholas Ave.</option>
      </optgroup>
      <optgroup label="June 19 — Juneteenth">
        <option>W. 120th St. &amp; Malcolm X Blvd.</option>
      </optgroup>
    </select>

    <label for="volunteer">Your Name <span class="req">*</span></label>
    <input type="text" id="volunteer" placeholder="First and last name" autocomplete="name" required>

    <label>Path <span class="req">*</span></label>
    <div class="radios">
      <label class="radio">
        <input type="radio" name="path" value="A — D9 Harlem Votes Drop-Off">
        <span class="radio-label">
          <strong>Path A — D9 Harlem Votes Drop-Off</strong>
          <span class="desc">Volunteer collects the form; coalition delivers to BOE.</span>
        </span>
      </label>
      <label class="radio">
        <input type="radio" name="path" value="B — Self-Delivery to BOE">
        <span class="radio-label">
          <strong>Path B — Self-Delivery to BOE</strong>
          <span class="desc">Voter mails or delivers their own form.</span>
        </span>
      </label>
    </div>

    <label for="notes">Notes <span style="color:var(--muted); font-weight:400;">(optional)</span></label>
    <textarea id="notes" placeholder="Anything the Activation Lead should know"></textarea>

    <button id="submitBtn">Log Registration</button>
    <div id="status" class="status"></div>

    <div class="count">
      Your registrations this shift
      <strong id="counter">0</strong>
    </div>

  </div>
  <div class="footer">D9 Harlem Votes™ — Boots on the Ground</div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKzCDI12QJrdt4xRKmKC3vHxYYmXOBM5hqAO-Q6Q_uJNDUDC5nvN8B5b4gJ8xU7EOjjA/exec';

  let count = 0;
  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  btn.addEventListener('click', submit);

  function submit() {
    const site = document.getElementById('site').value;
    const volunteer = document.getElementById('volunteer').value.trim();
    const pathEl = document.querySelector('input[name="path"]:checked');
    const notes = document.getElementById('notes').value.trim();

    if (!site) return showErr('Please select your site.');
    if (!volunteer) return showErr('Please enter your name.');
    if (!pathEl) return showErr('Please select Path A or Path B.');

    btn.disabled = true;
    btn.textContent = 'Logging…';
    statusEl.style.display = 'none';

    const payload = {
      siteName: site,
      volunteerName: volunteer,
      path: pathEl.value,
      notes: notes
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      count++;
      document.getElementById('counter').textContent = count;
      showOk('Registration logged. ✓');
      document.getElementById('notes').value = '';
      btn.disabled = false;
      btn.textContent = 'Log Registration';
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Log Registration';
      showErr('Connection issue. Check signal and try again.');
    });
  }

  function showOk(msg) {
    statusEl.className = 'status ok';
    statusEl.textContent = msg;
  }
  function showErr(msg) {
    statusEl.className = 'status err';
    statusEl.textContent = msg;
  }
</script>

</body>
</html>
